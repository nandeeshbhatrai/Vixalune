schema_version = 2
manifest_version = "1.0.0"
maintainer = "Vixalune catalog"
id = "nmap"
name = "Nmap"
summary = "Network discovery and port scanner."
description = "Nmap discovers hosts and services on a network by sending packets and analysing responses. Use it only against systems you own or are explicitly authorised to test, such as your local lab."
category = "reconnaissance"
tags = ["scanner", "ports", "discovery"]
license = "LicenseRef-Nmap"
homepage = "https://nmap.org"
documentation = "https://nmap.org/book/man.html"
source_repository = "https://github.com/nmap/nmap"
maintenance = "active"
recommended_for_beginners = true
platforms = ["windows_native"]

[provenance]
publisher = "Nmap Project"
basis = "package_repository"
source_url = "https://github.com/microsoft/winget-pkgs"
# Package id, installer type (nullsoft) and version (7.80) read from `winget show` on this date.
verified_on = "2026-10-17"

[windows]
min_build = 19045
architectures = ["x64"]

[[prerequisites]]
kind = "winget"
reason = "Installs Nmap from the Windows Package Manager."

[[install]]
method = "winget"
package_id = "Insecure.Nmap"

[integrity]
level = "package_manager"
note = "winget checks the installer SHA-256 from its catalog. The catalog carried Nmap 7.80 when verified; newer releases exist upstream."

[network]
install = true
run = true

[privileges]
install = "required"
run = "none"

[lifecycle]
can_update = true
can_uninstall = true

[verify]
timeout_secs = 30
[[verify.checks]]
kind = "package_installed"
[[verify.checks]]
kind = "executable_output"
runtime = "windows_native"
executable = "nmap.exe"
args = ["--version"]
locations = ["{ProgramFilesX86}\\Nmap", "{ProgramFiles}\\Nmap"]
expect_output_contains = "Nmap version"

[[launch_profiles]]
id = "scan"
label = "Scan a target"
description = "Run nmap against a host or range you are authorised to scan."
runtime = "windows_native"
executable = "nmap.exe"
args = [
  { kind = "flag", param = "service_scan", flag = "-sV" },
  { kind = "option", param = "ports", flag = "-p" },
  { kind = "value", param = "target" },
]

[[launch_profiles.parameters]]
name = "target"
label = "Target"
description = "Hostname, IP address or CIDR range you are authorised to scan."
required = true
kind = { type = "host" }

[[launch_profiles.parameters]]
name = "ports"
label = "Ports"
description = "Port list such as 22,80,443 or 1-1024."
kind = { type = "text", max_len = 64 }

[[launch_profiles.parameters]]
name = "service_scan"
label = "Detect service versions (-sV)"
kind = { type = "boolean" }
default = false
