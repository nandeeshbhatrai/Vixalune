schema_version = 2
manifest_version = "1.1.0"
maintainer = "Vixalune catalog"
id = "nmap"
name = "Nmap"
summary = "Network discovery and port scanner."
description = "Nmap discovers hosts and services on a network by sending packets and analysing responses. Use it only against systems you own or are explicitly authorised to test, such as your local practice lab."
category = "reconnaissance"
tags = ["scanner", "ports", "discovery"]
license = "LicenseRef-Nmap"
homepage = "https://nmap.org"
documentation = "https://nmap.org/book/man.html"
source_repository = "https://github.com/nmap/nmap"
maintenance = "active"
recommended_for_beginners = true
platforms = ["windows_native"]

[provenance]
publisher = "Nmap Project"
basis = "package_repository"
source_url = "https://github.com/microsoft/winget-pkgs"
# Package id, installer type (nullsoft) and version (7.80) read from `winget show` on this date.
verified_on = "2026-10-17"

[windows]
min_build = 19045
architectures = ["x64"]

[[prerequisites]]
kind = "winget"
reason = "Installs Nmap from the Windows Package Manager."

[[install]]
method = "winget"
package_id = "Insecure.Nmap"

[integrity]
level = "package_manager"
note = "winget checks the installer SHA-256 from its catalog. The catalog carried Nmap 7.80 when verified; newer releases exist upstream."

[network]
install = true
run = true

[privileges]
install = "required"
run = "none"

[lifecycle]
can_update = true
can_uninstall = true

[verify]
timeout_secs = 30
[[verify.checks]]
kind = "package_installed"
[[verify.checks]]
kind = "executable_output"
runtime = "windows_native"
executable = "nmap.exe"
args = ["--version"]
locations = ["{ProgramFilesX86}\\Nmap", "{ProgramFiles}\\Nmap"]
expect_output_contains = "Nmap version"

# ---------------------------------------------------------------- launch profiles
# Nmap runs unelevated: no raw-socket features (OS detection, SYN scan) are offered, so it never needs
# administrator rights. Profiles are intentionally narrow; there is no free-form argument field.

[[launch_profiles]]
id = "host-discovery"
label = "Find live hosts (no port scan)"
description = "Checks which addresses in a lab network answer. It does not scan ports."
runtime = "windows_native"
executable = "nmap.exe"
network_activity = "probes_targets"
timeout_secs = 300
output_format = "text"
expected_output = "Lines starting 'Nmap scan report for' for each host that is up, and a final 'Nmap done' summary."
findings_patterns = ['(?m)^Host is up']
args = [
  { kind = "literal", value = "-sn" },
  { kind = "value", param = "target" },
]

[[launch_profiles.parameters]]
name = "target"
label = "Target"
description = "A host name, an IP address, or a small CIDR range such as 192.168.56.0/24 (at most 4096 addresses)."
required = true
kind = { type = "host" }
default = "{lab:web_host}"

[[launch_profiles]]
id = "quick-scan"
label = "Scan the 100 most common ports"
description = "A fast look at which common services a host exposes. Only open ports are listed."
runtime = "windows_native"
executable = "nmap.exe"
network_activity = "probes_targets"
timeout_secs = 600
output_format = "text"
expected_output = "A table of open ports (PORT STATE SERVICE). No rows means no common port was open."
findings_patterns = ['(?m)^\d+/(tcp|udp)\s+open']
args = [
  { kind = "literal", value = "-F" },
  { kind = "literal", value = "--open" },
  { kind = "value", param = "target" },
]

[[launch_profiles.parameters]]
name = "target"
label = "Target"
description = "A host name or IP address you are authorised to scan."
required = true
kind = { type = "host" }
default = "{lab:web_host}"

[[launch_profiles]]
id = "service-scan"
label = "Identify services on chosen ports"
description = "Connects to the ports you list and tries to recognise the software answering."
runtime = "windows_native"
executable = "nmap.exe"
network_activity = "probes_targets"
timeout_secs = 900
output_format = "text"
expected_output = "For each open port, the service name and (when recognised) product and version."
findings_patterns = ['(?m)^\d+/(tcp|udp)\s+open']
args = [
  { kind = "literal", value = "-sV" },
  { kind = "literal", value = "--version-light" },
  { kind = "option", param = "ports", flag = "-p" },
  { kind = "value", param = "target" },
]

[[launch_profiles.parameters]]
name = "target"
label = "Target"
description = "A host name or IP address you are authorised to scan."
required = true
kind = { type = "host" }
default = "{lab:web_host}"

[[launch_profiles.parameters]]
name = "ports"
label = "Ports"
description = "Ports to check, for example 80,443 or 8000-8100 (at most 32 entries)."
required = true
kind = { type = "port_list" }
default = "{lab:web_port}"
