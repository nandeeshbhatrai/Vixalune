schema_version = 1
id = "semgrep"
name = "Semgrep"
summary = "Fast static analysis for finding bugs and insecure code patterns."
description = "Semgrep scans source code with pattern-based rules to find bugs and security issues. It runs here as a container image, so Docker is required. Scan only code you own or are authorised to review."
category = "vulnerability"
license = "LGPL-2.1-only"
homepage = "https://semgrep.dev"
documentation = "https://semgrep.dev/docs/"
source_repository = "https://github.com/semgrep/semgrep"
maintenance = "active"
platforms = ["container"]
prerequisites = ["docker"]

[[install]]
method = "container_image"
image = "semgrep/semgrep"
# Multi-arch index digest looked up from Docker Hub on 2026-10-17; re-verify before release.
digest = "sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3"

[verify]
runtime = "container"
executable = "semgrep"
args = ["--version"]
