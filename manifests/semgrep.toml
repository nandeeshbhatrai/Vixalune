schema_version = 2
manifest_version = "1.1.0"
maintainer = "Vixalune catalog"
id = "semgrep"
name = "Semgrep"
summary = "Fast static analysis for finding bugs and insecure code patterns."
description = "Semgrep scans source code with pattern-based rules to find bugs and security issues. It runs here as a container image, so Docker is required. Scan only code you own or are authorised to review. It is pulled by digest from Docker Hub and runs without network access, as a non-root user, with a read-only copy of the folder you choose."
category = "vulnerability"
tags = ["sast", "static-analysis"]
license = "LGPL-2.1-only"
homepage = "https://semgrep.dev"
documentation = "https://semgrep.dev/docs/"
source_repository = "https://github.com/semgrep/semgrep"
maintenance = "active"
platforms = ["container"]

[provenance]
publisher = "Semgrep, Inc."
basis = "official_upstream"
source_url = "https://hub.docker.com/r/semgrep/semgrep"
# Multi-arch index digest looked up from the Docker Hub API on this date; re-verify before release.
verified_on = "2026-10-17"

[windows]
min_build = 19045
architectures = ["x64", "arm64"]

[[prerequisites]]
kind = "docker"
reason = "Semgrep runs as a container image."
requires_admin = false

[[install]]
method = "container_image"
image = "semgrep/semgrep"
digest = "sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3"

[integrity]
level = "image_digest"
note = "The image is pinned by digest; the container runtime checks it on pull."

[network]
install = true
run = false

[privileges]
install = "none"
run = "none"

[lifecycle]
can_update = false
can_uninstall = true

[verify]
timeout_secs = 60
[[verify.checks]]
kind = "package_installed"
[[verify.checks]]
kind = "executable_output"
runtime = "container"
executable = "semgrep"
args = ["--version"]

# Every run uses these limits. Not verified against a live Docker engine in the development environment:
# if the image needs a writable HOME, /tmp (tmpfs) is provided and HOME points at it.
[container]
user = "65532:65532"
read_only_rootfs = true
memory_mb = 1024
cpus_milli = 1000
pids_limit = 256
tmpfs = ["/tmp"]
workdir = "/src"
env = [{ name = "HOME", value = "/tmp" }]
mounts = [{ name = "source", container_path = "/src", read_only = true }]

[[launch_profiles]]
id = "scan-local"
label = "Scan a folder with your own rules (offline)"
description = "No network access. Put a rules file inside the folder you choose."
runtime = "container"
executable = "semgrep"
mounts = ["source"]
timeout_secs = 900
output_format = "text"
exit_codes = { ok = [0], findings = [1] }
expected_output = "A list of findings (rule, file, line) or 'Ran N rules ... 0 findings'. Exit code 1 means findings, not a crash."
args = [
  { kind = "literal", value = "scan" },
  { kind = "option", param = "config", flag = "--config" },
  { kind = "literal", value = "--error" },
  { kind = "literal", value = "--metrics" },
  { kind = "literal", value = "off" },
  { kind = "literal", value = "--disable-version-check" },
  { kind = "literal", value = "/src" },
]

[[launch_profiles.parameters]]
name = "config"
label = "Rules file inside the folder"
description = "A path inside the mounted folder, for example /src/.semgrep.yml"
required = true
kind = { type = "text", max_len = 200 }
default = "/src/.semgrep.yml"

[[launch_profiles]]
id = "scan-registry-rules"
label = "Scan a folder with the Semgrep registry rules (needs internet)"
description = "Downloads the public rule set, so network access must be approved."
runtime = "container"
executable = "semgrep"
needs_network = true
network_activity = "downloads_data"
timeout_secs = 900
output_format = "text"
exit_codes = { ok = [0], findings = [1] }
expected_output = "Findings from the public rule set, or 0 findings."
mounts = ["source"]
args = [
  { kind = "literal", value = "scan" },
  { kind = "literal", value = "--config" },
  { kind = "literal", value = "p/default" },
  { kind = "literal", value = "--error" },
  { kind = "literal", value = "--metrics" },
  { kind = "literal", value = "off" },
  { kind = "literal", value = "--disable-version-check" },
  { kind = "literal", value = "/src" },
]


[[launch_profiles]]
id = "scan-sample"
label = "Scan the practice code project (offline)"
description = "Scans the safe sample project that Vixalune creates for exercises, with the sample rules it contains. No network access."
runtime = "container"
executable = "semgrep"
mounts = ["source"]
timeout_secs = 900
output_format = "text"
exit_codes = { ok = [0], findings = [1] }
expected_output = "Several findings in sample files (an eval of user input, a shell command built from input, a hard-coded password)."
suggested_mounts = [{ name = "source", value = "{lab:sample_folder}" }]
args = [
  { kind = "literal", value = "scan" },
  { kind = "literal", value = "--config" },
  { kind = "literal", value = "/src/.semgrep.yml" },
  { kind = "literal", value = "--error" },
  { kind = "literal", value = "--metrics" },
  { kind = "literal", value = "off" },
  { kind = "literal", value = "--disable-version-check" },
  { kind = "literal", value = "/src" },
]

