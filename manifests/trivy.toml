schema_version = 2
manifest_version = "1.0.0"
maintainer = "Vixalune catalog"
id = "trivy"
name = "Trivy"
summary = "Vulnerability and misconfiguration scanner for images, files and repositories."
description = "Trivy scans container images, file systems and infrastructure-as-code for known vulnerabilities, misconfigurations and exposed secrets. Use it on artifacts you own or are authorised to assess."
category = "vulnerability"
tags = ["scanner", "containers", "sbom"]
license = "Apache-2.0"
homepage = "https://trivy.dev"
documentation = "https://trivy.dev/latest/docs/"
source_repository = "https://github.com/aquasecurity/trivy"
maintenance = "active"
platforms = ["windows_native"]

[provenance]
publisher = "Aqua Security Software"
basis = "package_repository"
source_url = "https://github.com/microsoft/winget-pkgs"
# Package id, installer type (portable zip, from the project's GitHub release) and version (0.76.0) read from `winget show` on this date.
verified_on = "2026-10-17"

[windows]
min_build = 19045
architectures = ["x64"]

[[prerequisites]]
kind = "winget"
reason = "Installs Trivy from the Windows Package Manager."

[[install]]
method = "winget"
package_id = "AquaSecurity.Trivy"

[integrity]
level = "package_manager"
note = "winget checks the SHA-256 of the release archive from its catalog."

[network]
install = true
run = true

[privileges]
install = "none"
run = "none"

[lifecycle]
can_update = true
can_uninstall = true

[verify]
timeout_secs = 30
[[verify.checks]]
kind = "package_installed"
[[verify.checks]]
kind = "executable_output"
runtime = "windows_native"
executable = "trivy.exe"
args = ["--version"]
locations = ["{LocalAppData}\\Microsoft\\WinGet\\Links"]
expect_output_contains = "Version"
