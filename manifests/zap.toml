schema_version = 2
manifest_version = "1.1.0"
maintainer = "Vixalune catalog"
id = "zap"
name = "OWASP ZAP"
summary = "Intercepting proxy and scanner for web application security testing."
description = "ZAP (Zed Attack Proxy) helps find vulnerabilities in web applications by proxying and actively or passively scanning traffic. Point it only at applications you own or are authorised to test, such as a local lab."
category = "web_application"
tags = ["proxy", "scanner", "web"]
license = "Apache-2.0"
homepage = "https://www.zaproxy.org"
documentation = "https://www.zaproxy.org/docs/"
source_repository = "https://github.com/zaproxy/zaproxy"
maintenance = "active"
recommended_for_beginners = true
platforms = ["windows_native"]

[provenance]
publisher = "ZAP"
basis = "package_repository"
source_url = "https://github.com/microsoft/winget-pkgs"
# Package id, installer type (exe) and version (2.17.0) read from `winget show` on this date.
verified_on = "2026-10-17"

[windows]
min_build = 19045
architectures = ["x64"]

[[prerequisites]]
kind = "winget"
reason = "Installs ZAP from the Windows Package Manager."

[[install]]
method = "winget"
package_id = "ZAP.ZAP"

[integrity]
level = "package_manager"
note = "winget checks the installer SHA-256 from its catalog. The install folder and a runnable check for ZAP have not been verified, so verification only confirms winget's package record."

[network]
install = true
run = true

[privileges]
install = "possible"
run = "none"

[lifecycle]
can_update = true
can_uninstall = true

[verify]
timeout_secs = 30
[[verify.checks]]
kind = "package_installed"

# ---------------------------------------------------------------- launch profiles
# UNVERIFIED on real hardware: the install folder, the executable name and the command-line options below follow
# the ZAP documentation (-cmd, -quickurl, -quickout, -quickprogress) but have not been run by Vixalune.
# Verification above only confirms winget's package record, so a wrong guess shows up as "not found", never as success.

[[launch_profiles]]
id = "quick-scan"
label = "Quick scan of a web application (spider + active scan, writes an HTML report)"
description = "ZAP crawls the site and actively probes it for common problems. This sends many requests, so use it only on your own practice application or a site you are authorised to test."
runtime = "windows_native"
executable = "zap.exe"
locations = ["{ProgramFiles}\\ZAP\\Zed Attack Proxy", "{ProgramFilesX86}\\ZAP\\Zed Attack Proxy"]
network_activity = "probes_targets"
timeout_secs = 1800
output_format = "html"
expected_output = "Progress messages, then an HTML report (zap-report.html) in the run folder listing alerts by risk level."
args = [
  { kind = "literal", value = "-cmd" },
  { kind = "option", param = "url", flag = "-quickurl" },
  { kind = "run_file", name = "zap-report.html", flag = "-quickout" },
  { kind = "literal", value = "-quickprogress" },
]

[[launch_profiles.parameters]]
name = "url"
label = "Web application URL"
description = "An http:// or https:// address, for example the practice application shown in Learning Labs."
required = true
kind = { type = "url" }
default = "{lab:web_url}"


