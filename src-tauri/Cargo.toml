[package]
name = "vixalune"
version = "0.1.0"
description = "Unified Windows toolkit for discovering, installing and learning open-source security tools."
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "vixalune_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
async-trait = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
regex = "1"
ipnet = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros", "net"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"



